[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyguard"
version = "1.0.0"
description = "Personal cyber-safety tool: URL risk/phishing scanning, data breach checking, and a privacy dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "joblib>=1.3",
    "requests>=2.31",
    "browser-history>=0.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
privacyguard = "privacyguard.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privacyguard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
